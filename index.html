idth:760px;margin:70px auto;padding:18px;border:1px solid var(--border);background:var(--surface);border-radius:14px;text-align:center}.reader-fallback strong{display:block;margin-bottom:5px}.reader-fallback p{font-size:10px;color:var(--muted);line-height:1.55}.reader-embed{width:100%;height:100%;border:0;background:#fff}.reader-loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:24px;z-index:200;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--surface3);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:9px 13px;font-size:11px;box-shadow:var(--shadow);transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-nav{display:none}.mobile-more{display:none}

);color:var(--text);border-radius:11px;padding:13px 7px;font-size:10px}.mobile-more-grid button span{display:block;font-size:19px;margin-bottom:4px}}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">P</div><div class="brand-copy"><strong>PaperShelf</strong><span data-i18n="appTagline"></span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-card">
      <strong data-i18n="singleFile"></strong>
      <span data-i18n="backupReminder"></span>
      <div class="sidebar-mini"><button class="btn sm" id="side-theme">◐</button><button class="btn sm" id="side-lang">中 / EN</button></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="mobile-brand"><div class="brand-mark">P</div><strong>PaperShelf</strong></div>
      <div class="search"><input id="global-search" autocomplete="off" /></div>
      <button class="btn primary" id="add-papers">＋ <span data-i18n="addPapers"></span></button>
      <button class="btn icon desktop-only" id="theme-btn" title="Theme">◐</button>
      <button class="btn desktop-only" id="lang-btn">中 / EN</button>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<nav class="mobile-nav" id="mobile-nav"></nav>
<div id="mobile-more-root"></div>
<div id="modal-root"></div>
<div id="reader-root"></div>
<input type="file" id="backup-file" accept="application/json,.json" class="hidden" />
<div class="toast" id="toast"></div>
<script>var PaperShelfCore;
(function (PaperShelfCore) {
    function uid(prefix = 'paper') {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    }
    PaperShelfCore.uid = uid;
    function nowIso() {
        return new Date().toISOString();
    }
    PaperShelfCore.nowIso = nowIso;
    function normalizeArxiv(raw) {
        let s = String(raw || '').trim();
        s = s.replace(/^arxiv:/i, '');
        s = s.replace(/^https?:\/\/(?:www\.)?arxiv\.org\/(?:abs|html|pdf)\//i, '');
        s = s.replace(/\.pdf(?:\?.*)?$/i, '');
        s = s.replace(/[?#].*$/, '');
        s = s.replace(/v\d+$/i, '');
        return s.trim();
    }
    PaperShelfCore.normalizeArxiv = normalizeArxiv;
    function normalizeDoi(raw) {
        let s = String(raw || '').trim();
        s = s.replace(/^doi\s*:\s*/i, '');
        s = s.replace(/^https?:\/\/(?:dx\.)?doi\.org\//i, '');
        s = s.replace(/[?#].*$/, '');
        return s.toLowerCase().trim();
    }
    PaperShelfCore.normalizeDoi = normalizeDoi;
    function normalizeOpenReview(raw) {
        const s = String(raw || '').trim();
        const m = s.match(/[?&]id=([^&#]+)/i);
        return decodeURIComponent(m ? m[1] : s.replace(/^openreview:/i, '').trim());
    }
    PaperShelfCore.normalizeOpenReview = normalizeOpenReview;
    function normalizeTitle(raw) {
        return String(raw || '')
            .normalize('NFKC')
            .toLowerCase()
            .replace(/https?:\/\/\S+/g, '')
            .replace(/[“”‘’"'`]/g, '')
            .replace(/[^\p{L}\p{N}]+/gu, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }
    PaperShelfCore.normalizeTitle = normalizeTitle;
    function parseIdentifiers(input) {
        const text = String(input || '').trim();
        const identifiers = {};
        const sources = [];
        let url = '';
        let readerUrl = '';
        const addSource = (type, label, sourceUrl) => {
            if (!sourceUrl)

    async function enrichPaper(p, announce = false) {
        if (announce)
            toast(t('enriching'));
        p.enrichmentStatus = 'running';
        await savePaper(p, false);
        try {
            let data = null;
            let lookup = '';
            if (p.identifiers.arxiv)
                lookup = 'ARXIV:' + p.identifiers.arxiv;
            else if (p.identifiers.doi)
                lookup = 'DOI:' + p.identifiers.doi;
            else if (p.identifiers.s2)
                lookup = p.identifiers.s2;
            if (lookup) {
                const r = await fetch(`https://api.semanticscholar.org/graph/v1/paper/${encodeURIComponent(lookup)}?fields=title,abstract,authors,year,venue,url,externalIds,publicationDate,citationCount`, { headers: { Accept: 'application/json' } });
                if (r.ok)
                    data = await r.json();
            }
            else if (p.title) {
                const r = await fetch(`https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(p.title)}&limit=1&fields=title,abstract,authors,year,venue,url,externalIds,publicationDate,citationCount`, { headers: { Accept: 'application/json' } });
                if (r.ok)
                    data = (await r.json()).data?.[0] || null;
            }
            if (!data)
                throw new Error('metadata unavailable');
            p.title = p.title || data.title || '';
            p.abstract = p.abstract || data.abstract || '';
            p.authors = p.authors.length ? p.authors : (data.authors || []).map((a) => a.name).filter(Boolean);
            p.year = p.year || String(data.year || '');
            p.venue = p.venue || data.venue || '';
            p.publishedAt = p.publishedAt || data.publicationDate || '';
            p.citationCount = data.citationCount ?? p.citationCount;
            const ext = data.externalIds || {};
            if (ext.ArXiv)
                p.identifiers.arxiv = PaperShelfCore.normalizeArxiv(ext.ArXiv);
            if (ext.DOI)
                p.identifiers.doi = PaperShelfCore.normalizeDoi(ext.DOI);
            p.canonicalKey = PaperShelfCore.canonicalKey(p.identifiers, p.title, p.authors);
            p.readerUrl = p.readerUrl || PaperShelfCore.deriveReaderUrl(p.identifiers, p.sourceUrl);
            if (data.url)
                p.sources = PaperShelfCore.mergeSources(p.sources, [{ type: 'semantic-scholar', label: 'Semantic Scholar', url: data.url }]);
            p.enrichmentStatus = 'done';
            const duplicate = S.papers.find(x => x.id !== p.id && PaperShelfCore.samePaper(x, p));
            if (duplicate) {
                const merged = PaperShelfCore.mergePaper(duplicate, p);
                await savePaper(merged, false);
                await removePaper(p.id);
                p = merged;
            }
            else
                await savePaper(p, false);
            if (announce) {
                toast(t('enrichDone'));
                $('modal-root').innerHTML = '';
                openDetail(p.id);
            }
            renderPage();
        }
        catch {
            p.enrichmentStatus = 'failed';
            await savePaper(p, false);
            if (announce)
                toast(t('enrichFail'), 3300);
        }
    }

    async function loadWebReader(p) {
        const main = $('reader-main');
        const url = p.readerUrl || p.sourceUrl || p.sources[0]?.url || '';
        if (!url) {
            main.innerHTML = `<div class="reader-fallback"><strong>${t('readerBlocked')}</strong></div>`;
            return;
        }
        main.innerHTML = `<div class="reader-loading">${t('readerLoading')}</div>`;
        try {
            const r = await fetch(url, { mode: 'cors', credentials: 'omit' });
            if (!r.ok)
                throw new Error(String(r.status));
            const html = await r.text();
            const clean = extractReadableHtml(html, url);
            if (!clean)
                throw new Error('empty');
            main.innerHTML = `<article class="web-article">${clean}</article>`;
            bindReaderProgress(p);
        }
        catch {
            main.innerHTML = `<div class="reader-fallback"><strong>${t('readerBlocked')}</strong><p>${esc(url)}</p><div class="toolbar" style="justify-content:center"><button class="btn" id="reader-embed-btn">${t('tryEmbed')}</button><button class="btn primary" id="reader-open-btn">↗ ${t('openOriginal')}</button></div></div>`;
            $('reader-open-btn').onclick = () => openExternal(url);
            $('reader-embed-btn').onclick = () => { S.readerMode = 'embed'; main.innerHTML = `<iframe class="reader-embed" src="${esc(url)}" referrerpolicy="no-referrer"></iframe>`; };
        }
    }
    function extractReadableHtml(html, base) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('script,style,noscript,iframe,object,embed,nav,header,footer,form,button').forEach(e => e.remove());
        const root = doc.querySelector('main,.ltx_page_main,article,.paper,body');
        if (!root)
            return '';
        root.querySelectorAll('*').forEach(el => { Array.from(el.attributes).forEach(a => { if (/^on/i.test(a.name) || a.name === 'srcdoc')
            el.removeAttribute(a.name); }); for (const attr of ['href', 'src']) {
            const v = el.getAttribute(attr);
            if (v) {
                if (/^javascript:/i.test(v)) {
                    el.removeAttribute(attr);
                }
                else if (!/^(data:|mailto:|#)/i.test(v)) {
                    try {
                        el.setAttribute(attr, new URL(v, base).href);
                    }
                    catch { }
                }
            }
        } });
        return root.innerHTML;
    }
    function bindReaderProgress(p) { const main = $('reader-main'); const save = debounce(async () => { const max = main.scrollHeight - main.clientHeight; p.readProgress = max > 0 ? Math.max(0, Math.min(100, Math.round(main.scrollTop / max * 100))) : 0; await savePaper(p, false); }, 600); main.addEventListener('scroll', save); restoreReaderProgress(p); }
    function restoreReaderProgress(p) { const main = $('reader-main'); requestAnimationFrame(() => { const max = main.scrollHeight - main.clientHeight; if (max > 0 && p.readProgress)
        main.scrollTop = max * p.readProgress / 100; }); }
    function closeReader() { const p = findPaper(S.readerId); if (p)
        savePaper(p, false); S.readerId = ''; $('reader-root').innerHTML = ''; renderPage(); }
    function exportBackup() { downloadText(`PaperShelf_Backup_${PaperShelfCore.dateKey()}.json`, JSON.stringify({ schema: 2, exportedAt: PaperShelfCore.nowIso(), settings: S.settings, papers: S.papers }, null, 2), 'application/json'); }
    async function importBackupFile(e) { const f = e.target.files?.[0]; if (!f)
        return; try {
        const j = JSON.parse(await f.text());
        const arr = Array.isArray(j) ? j : (j.papers || []);
        if (j.settings)
            S.settings = { ...S.settings, ...j.settings };
        for (const raw of arr) {
            const p = { ...PaperShelfCore.paperFromCandidate({ url: raw.sourceUrl || '', title: raw.title || '' }), ...raw, id: raw.id || PaperShelfCore.uid() };
            const ex = S.papers.find(x => PaperShelfCore.samePaper(x, p));
            await savePaper(ex ? PaperShelfCore.mergePaper(ex, p) : p, false);
        }
        saveSettings();
        toast(`${t('importDone')}: ${arr.length}`);
        renderPage();
    }
    catch {
        toast('Invalid backup');
    }
    finally {
        e.target.value = '';
    } }
    function exportBibtex() { const active = S.papers.filter(activePaper); const text = active.map((p, i) => { const key = (p.authors[0]?.split(' ').pop() || 'paper') + (p.year || '') + (i + 1); return `@article{${key},\n  title={${p.title || p.titleZh}},\n  author={${p.authors.join(' and ')}},\n  year={${p.year || ''}},\n  journal={${p.venue || ''}},\n  doi={${p.identifiers.doi || ''}},\n  url={${p.sourceUrl || p.sources[0]?.url || ''}}\n}`; }).join('\n\n'); downloadText('PaperShelf.bib', text, 'text/plain'); }
    function exportCsv() { const rows = [['title', 'title_zh', 'authors', 'year', 'venue', 'score', 'priority', 'status', 'tags', 'url'], ...S.papers.filter(activePaper).map(p => [p.title, p.titleZh, p.authors.join('; '), p.year, p.venue, String(p.gptScore), String(p.priority), p.readStatus, p.tags.join('; '), p.sourceUrl || p.sources[0]?.url || ''])]; const text = rows.map(r => r.map(csvCell).join(',')).join('\n'); downloadText('PaperShelf.csv', text, 'text/csv;charset=utf-8'); }
    function csvCell(v) { return `"${String(v || '').replace(/"/g, '""')}"`; }
    function downloadText(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
    async function resetAll() { if (!confirm(t('confirmReset')))
        return; await PaperShelfDB.clear(); S.papers = []; S.settings = { ...DEFAULT_SETTINGS }; S.page = 'today'; saveSettings(); renderChrome(); renderPage(); }
    function debounce(fn, ms = 250) { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); }; }
    function bindTop() {
        $('add-papers').onclick = openImport;
        $('theme-btn').onclick = cycleTheme;
        $('side-theme').onclick = cycleTheme;
        $('lang-btn').onclick = toggleLanguage;
        $('side-lang').onclick = toggleLanguage;
        $('global-search').oninput = e => { S.q = e.target.value; renderPage(); };
        $('global-search').onkeydown = e => { if (e.key === 'Enter') {
            const v = e.currentTarget.value.trim();
            const ids = PaperShelfCore.parseIdentifiers(v);
            if (v && (ids.url || Object.keys(ids.identifiers).length)) {
                openImport();
                setTimeout(() => { $('import-text').value = v; analyzeImport(); }, 0);
            }
        } };
        $('backup-file').onchange = importBackupFile;
    }
    async function init() {
        loadSettings();
        applyTheme();
        await PaperShelfDB.init();
        S.papers = await PaperShelfDB.all();
        bindTop();
        renderChrome();
        renderPage();
        matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (S.settings.theme === 'system') {
            applyTheme();
            renderChrome();
        } });
        window.__PaperShelf = { parseImportText: PaperShelfCore.parseImportText, parseIdentifiers: PaperShelfCore.parseIdentifiers, canonicalKey: PaperShelfCore.canonicalKey, samePaper: PaperShelfCore.samePaper, paperFromCandidate: PaperShelfCore.paperFromCandidate };
    }
    PaperShelfApp.init = init;
})(PaperShelfApp || (PaperShelfApp = {}));
window.addEventListener('DOMContentLoaded', () => PaperShelfApp.init().catch(err => { console.error(err); document.body.innerHTML = '<pre style="padding:24px">PaperShelf failed to initialize.\n' + String(err) + '</pre>'; }));
</script>
